global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          environment: labo

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Exemple pour superviser des hôtes distants (VM du cluster kubeadm, etc.) :
  # installez node_exporter sur chaque hôte, puis décommentez et complétez :
  # - job_name: remote-hosts
  #   static_configs:
  #     - targets:
  #         - "<ip-hote-1>:9100"
  #         - "<ip-hote-2>:9100"
