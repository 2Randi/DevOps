---
- hosts: ansible-server
  become: true

  tasks:
  - name: créer l'image docker à partir du fichier war
    command: docker build -t simple-devops-image:latest .
    args:
      chdir: /opt/k8s-lab

  - name: créer le tag de l'image
    command: docker tag simple-devops-image 2randi/simple-devops-image

  - name: pousser l'image sur dockerhub
    command: docker push 2randi/simple-devops-image

  - name: supprimer les images docker du serveur ansible
    command: docker rmi simple-devops-image:latest 2randi/simple-devops-image
    ignore_errors: yes
